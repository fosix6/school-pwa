<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>School Manager</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#f1efe8" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app"></div>

<!-- Template Dialog -->
<dialog id="templateDialog">
    <form method="dialog" id="templateForm">
        <h2 id="templateDialogTitle">New class roster</h2>
        <label>
            Roster name
            <input type="text" id="templateNameInput" required placeholder="e.g. 10 RPL" />
        </label>
        <h3>Students (attendance list)</h3>
        <label>
            One name per line
            <textarea id="rosterNamesInput" rows="6" placeholder="Reyhan Ananda Putra&#10;Muhammad Rashya Alfarizqy"></textarea>
        </label>
        <h3>Piket (cleaning duty) — names per weekday</h3>
        <div id="dayInputsContainer"></div>
        <div class="dialog-actions">
            <button type="button" id="templateCancelBtn">Cancel</button>
            <button type="submit" id="templateSaveBtn">Save roster</button>
        </div>
    </form>
</dialog>

<!-- Instantiate Day Dialog -->
<dialog id="instantiateDialog">
    <form method="dialog" id="instantiateForm">
        <h2>New day</h2>
        <label>
            Date
            <input type="date" id="instanceDateInput" required />
        </label>
        <label>
            From roster
            <select id="instanceTemplateSelect"></select>
        </label>
        <div class="dialog-actions">
            <button type="button" id="instantiateCancelBtn">Cancel</button>
            <button type="submit">Create day</button>
        </div>
    </form>
</dialog>

<!-- Proof Dialog -->
<dialog id="proofDialog">
    <form method="dialog" id="proofForm">
        <h2>Proof of work</h2>
        <label>
            Notes
            <textarea id="proofNoteInput" rows="4" placeholder="What was done today..."></textarea>
        </label>
        <label>
            Photos
            <input type="file" id="proofPhotoInput" accept="image/*" multiple />
        </label>
        <div id="proofPhotoPreview" class="photo-preview"></div>
        <div class="dialog-actions">
            <button type="button" id="proofCancelBtn">Cancel</button>
            <button type="submit">Save</button>
        </div>
    </form>
</dialog>

<!-- Piket Schedule Builder Dialog -->
<dialog id="piketBuilderDialog">
    <form method="dialog" id="piketBuilderForm">
        <h2>🧹 Piket Schedule Builder</h2>
        <label>
            Class
            <select id="piket-class-selector">
                <option value="">-- Select --</option>
            </select>
        </label>
        <label>
            Day
            <select id="piket-day-selector">
                <option value="Monday">Senin</option>
                <option value="Tuesday">Selasa</option>
                <option value="Wednesday">Rabu</option>
                <option value="Thursday">Kamis</option>
                <option value="Friday">Jumat</option>
            </select>
        </label>
        <label>
            Search students
            <input type="text" id="piket-student-search" placeholder="Type name or NIS..." />
        </label>
        <div class="piket-builder-layout">
            <div class="piket-student-pool">
                <h4>All students</h4>
                <div id="piket-student-list" class="student-search-list"></div>
            </div>
            <div class="piket-selected-pool">
                <h4>Selected for <span id="piket-day-label">Senin</span></h4>
                <div id="piket-selected-students" class="selected-students"></div>
            </div>
        </div>
        <div id="piket-json-output" style="display:none;">
            <pre id="piket-json-preview"></pre>
        </div>
        <div id="piket-status" class="status-msg"></div>
        <div class="dialog-actions">
            <button type="button" id="piket-clear-btn">Clear</button>
            <button type="button" id="piket-generate-btn">Generate JSON</button>
            <button type="button" id="piket-save-btn" style="display:none;">💾 Save</button>
            <button type="button" id="piket-close-btn">Close</button>
        </div>
    </form>
</dialog>

<script src="jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
